AWSTemplateFormatVersion: "2010-09-09"
Description: "Grafana on EC2 — fully self-contained bootstrap via cfn-init, no manual steps after deploy"

Parameters:
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: "Existing EC2 key pair name for SSH access"
  AllowedSSHCidr:
    Type: String
    Default: "0.0.0.0/0"
    Description: "CIDR block for SSH access — restrict to your IP (e.g. 1.2.3.4/32)"
  AllowedGrafanaCidr:
    Type: String
    Default: "0.0.0.0/0"
    Description: "CIDR block for Grafana UI access on port 3000"
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: "vpc-0237dd5f0dc025eaa"
    Description: "VPC to deploy into (fastapi-app-vpc)"
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Default: "subnet-09ef1abedfebf6663"
    Description: "Public subnet within the VPC"
  InstanceType:
    Type: String
    Default: "t3.small"
    AllowedValues: ["t3.micro", "t3.small", "t3.medium"]
    Description: "EC2 instance type"

Resources:

  # ── IAM: lets cfn-init read stack metadata and cfn-signal report back ──
  GrafanaEC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: grafana-datarecon-ec2-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cfn-init-signal
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStackResource
                  - cloudformation:SignalResource
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"

  GrafanaInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: grafana-datarecon-instance-profile
      Roles:
        - !Ref GrafanaEC2Role

  GrafanaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Grafana + datarecon: SSH and Grafana UI access"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSSHCidr
          Description: "SSH access"
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: !Ref AllowedGrafanaCidr
          Description: "Grafana UI"

  GrafanaEC2Instance:
    Type: AWS::EC2::Instance
    # cfn-init: provisioning files are defined here and applied during UserData bootstrap.
    # Execution order: packages → files → commands → services
    Metadata:
      AWS::CloudFormation::Init:
        config:
          files:
            /etc/grafana/provisioning/datasources/infinity.yaml:
              owner: grafana
              group: grafana
              mode: "000644"
              content: |
                apiVersion: 1

                datasources:
                  - name: datarecon-api
                    uid: datarecon-infinity
                    type: yesoreyeram-infinity-datasource
                    access: proxy
                    isDefault: true
                    jsonData:
                      base_url: "https://1yyjmleyke.execute-api.us-east-1.amazonaws.com/dev"
                      allowed_hosts:
                        - "https://1yyjmleyke.execute-api.us-east-1.amazonaws.com"

            /etc/grafana/provisioning/dashboards/dashboard.yaml:
              owner: grafana
              group: grafana
              mode: "000644"
              content: |
                apiVersion: 1

                providers:
                  - name: datarecon
                    orgId: 1
                    folder: "datarecon"
                    folderUid: "datarecon"
                    type: file
                    disableDeletion: false
                    updateIntervalSeconds: 30
                    allowUiUpdates: true
                    options:
                      path: /var/lib/grafana/dashboards
                      foldersFromFilesStructure: false

            /var/lib/grafana/dashboards/datarecon.json:
              owner: grafana
              group: grafana
              mode: "000644"
              content: |
                {
                  "__inputs": [],
                  "__requires": [
                    { "type": "datasource", "id": "yesoreyeram-infinity-datasource", "name": "Infinity", "version": "2.0.0" },
                    { "type": "grafana", "id": "grafana", "name": "Grafana", "version": "10.4.0" },
                    { "type": "panel", "id": "stat", "name": "Stat", "version": "" },
                    { "type": "panel", "id": "barchart", "name": "Bar chart", "version": "" },
                    { "type": "panel", "id": "bargauge", "name": "Bar gauge", "version": "" },
                    { "type": "panel", "id": "piechart", "name": "Pie chart", "version": "" },
                    { "type": "panel", "id": "table", "name": "Table", "version": "" }
                  ],
                  "annotations": { "list": [] },
                  "description": "Waste vendor invoice reconciliation — invoice weight vs IoT-measured weight",
                  "editable": true,
                  "fiscalYearStartMonth": 0,
                  "graphTooltip": 1,
                  "id": null,
                  "links": [],
                  "panels": [
                    {
                      "id": 1,
                      "title": "Service Health",
                      "type": "stat",
                      "gridPos": { "h": 3, "w": 3, "x": 0, "y": 0 },
                      "options": {
                        "colorMode": "background",
                        "graphMode": "none",
                        "justifyMode": "center",
                        "textMode": "value_and_name",
                        "reduceOptions": { "calcs": ["lastNotNull"], "fields": "/^status$/", "values": false }
                      },
                      "fieldConfig": {
                        "defaults": {
                          "mappings": [
                            { "type": "value", "options": { "ok": { "text": "OK", "color": "green", "index": 0 } } },
                            { "type": "special", "options": { "match": "null", "result": { "text": "DOWN", "color": "red", "index": 1 } } }
                          ],
                          "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 1 }] },
                          "color": { "mode": "thresholds" }
                        },
                        "overrides": []
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "datarecon-infinity" },
                          "type": "json",
                          "source": "url",
                          "url": "https://1yyjmleyke.execute-api.us-east-1.amazonaws.com/dev/v1/health",
                          "url_options": { "method": "GET" },
                          "root_selector": "",
                          "columns": [{ "selector": "status", "text": "status", "type": "string" }],
                          "format": "table"
                        }
                      ]
                    },
                    {
                      "id": 2,
                      "title": "Total Line Items",
                      "type": "stat",
                      "gridPos": { "h": 3, "w": 3, "x": 3, "y": 0 },
                      "options": {
                        "colorMode": "value",
                        "graphMode": "none",
                        "justifyMode": "center",
                        "textMode": "value_and_name",
                        "reduceOptions": { "calcs": ["lastNotNull"], "fields": "/^total_line_items$/", "values": false }
                      },
                      "fieldConfig": {
                        "defaults": {
                          "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] },
                          "color": { "mode": "thresholds" }
                        },
                        "overrides": []
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "datarecon-infinity" },
                          "type": "json",
                          "source": "url",
                          "url": "https://1yyjmleyke.execute-api.us-east-1.amazonaws.com/dev/v1/reconcile?year=${year}&month=${month}",
                          "url_options": { "method": "GET" },
                          "root_selector": "summary",
                          "columns": [{ "selector": "total_line_items", "text": "total_line_items", "type": "number" }],
                          "format": "table"
                        }
                      ]
                    },
                    {
                      "id": 3,
                      "title": "Within Tolerance",
                      "type": "stat",
                      "gridPos": { "h": 3, "w": 3, "x": 6, "y": 0 },
                      "options": {
                        "colorMode": "background",
                        "graphMode": "none",
                        "justifyMode": "center",
                        "textMode": "value_and_name",
                        "reduceOptions": { "calcs": ["lastNotNull"], "fields": "/^within_tolerance$/", "values": false }
                      },
                      "fieldConfig": {
                        "defaults": {
                          "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] },
                          "color": { "mode": "thresholds" }
                        },
                        "overrides": []
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "datarecon-infinity" },
                          "type": "json",
                          "source": "url",
                          "url": "https://1yyjmleyke.execute-api.us-east-1.amazonaws.com/dev/v1/reconcile?year=${year}&month=${month}",
                          "url_options": { "method": "GET" },
                          "root_selector": "summary",
                          "columns": [{ "selector": "within_tolerance", "text": "within_tolerance", "type": "number" }],
                          "format": "table"
                        }
                      ]
                    },
                    {
                      "id": 4,
                      "title": "Over Tolerance",
                      "type": "stat",
                      "gridPos": { "h": 3, "w": 3, "x": 9, "y": 0 },
                      "options": {
                        "colorMode": "background",
                        "graphMode": "none",
                        "justifyMode": "center",
                        "textMode": "value_and_name",
                        "reduceOptions": { "calcs": ["lastNotNull"], "fields": "/^over_tolerance$/", "values": false }
                      },
                      "fieldConfig": {
                        "defaults": {
                          "thresholds": { "mode": "absolute", "steps": [{ "color": "red", "value": null }] },
                          "color": { "mode": "thresholds" }
                        },
                        "overrides": []
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "datarecon-infinity" },
                          "type": "json",
                          "source": "url",
                          "url": "https://1yyjmleyke.execute-api.us-east-1.amazonaws.com/dev/v1/reconcile?year=${year}&month=${month}",
                          "url_options": { "method": "GET" },
                          "root_selector": "summary",
                          "columns": [{ "selector": "over_tolerance", "text": "over_tolerance", "type": "number" }],
                          "format": "table"
                        }
                      ]
                    },
                    {
                      "id": 5,
                      "title": "Invoice Only",
                      "type": "stat",
                      "gridPos": { "h": 3, "w": 3, "x": 12, "y": 0 },
                      "options": {
                        "colorMode": "background",
                        "graphMode": "none",
                        "justifyMode": "center",
                        "textMode": "value_and_name",
                        "reduceOptions": { "calcs": ["lastNotNull"], "fields": "/^invoice_only$/", "values": false }
                      },
                      "fieldConfig": {
                        "defaults": {
                          "thresholds": { "mode": "absolute", "steps": [{ "color": "orange", "value": null }] },
                          "color": { "mode": "thresholds" }
                        },
                        "overrides": []
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "datarecon-infinity" },
                          "type": "json",
                          "source": "url",
                          "url": "https://1yyjmleyke.execute-api.us-east-1.amazonaws.com/dev/v1/reconcile?year=${year}&month=${month}",
                          "url_options": { "method": "GET" },
                          "root_selector": "summary",
                          "columns": [{ "selector": "invoice_only", "text": "invoice_only", "type": "number" }],
                          "format": "table"
                        }
                      ]
                    },
                    {
                      "id": 6,
                      "title": "Measurement Only",
                      "type": "stat",
                      "gridPos": { "h": 3, "w": 3, "x": 15, "y": 0 },
                      "options": {
                        "colorMode": "background",
                        "graphMode": "none",
                        "justifyMode": "center",
                        "textMode": "value_and_name",
                        "reduceOptions": { "calcs": ["lastNotNull"], "fields": "/^measurement_only$/", "values": false }
                      },
                      "fieldConfig": {
                        "defaults": {
                          "thresholds": { "mode": "absolute", "steps": [{ "color": "yellow", "value": null }] },
                          "color": { "mode": "thresholds" }
                        },
                        "overrides": []
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "datarecon-infinity" },
                          "type": "json",
                          "source": "url",
                          "url": "https://1yyjmleyke.execute-api.us-east-1.amazonaws.com/dev/v1/reconcile?year=${year}&month=${month}",
                          "url_options": { "method": "GET" },
                          "root_selector": "summary",
                          "columns": [{ "selector": "measurement_only", "text": "measurement_only", "type": "number" }],
                          "format": "table"
                        }
                      ]
                    },
                    {
                      "id": 7,
                      "title": "Total Invoice Weight (kg)",
                      "type": "stat",
                      "gridPos": { "h": 3, "w": 6, "x": 18, "y": 0 },
                      "options": {
                        "colorMode": "value",
                        "graphMode": "none",
                        "justifyMode": "center",
                        "textMode": "value_and_name",
                        "reduceOptions": { "calcs": ["lastNotNull"], "fields": "/^total_invoice_weight_kg$/", "values": false }
                      },
                      "fieldConfig": {
                        "defaults": {
                          "unit": "kg",
                          "decimals": 1,
                          "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] },
                          "color": { "mode": "thresholds" }
                        },
                        "overrides": []
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "datarecon-infinity" },
                          "type": "json",
                          "source": "url",
                          "url": "https://1yyjmleyke.execute-api.us-east-1.amazonaws.com/dev/v1/reconcile?year=${year}&month=${month}",
                          "url_options": { "method": "GET" },
                          "root_selector": "summary",
                          "columns": [{ "selector": "total_invoice_weight_kg", "text": "total_invoice_weight_kg", "type": "number" }],
                          "format": "table"
                        }
                      ]
                    },
                    {
                      "id": 8,
                      "title": "Invoice vs Measured Weight by Vendor (kg)",
                      "description": "Side-by-side comparison of reported invoice weight vs IoT-measured weight per vendor",
                      "type": "barchart",
                      "gridPos": { "h": 10, "w": 14, "x": 0, "y": 3 },
                      "options": {
                        "barWidth": 0.7,
                        "groupWidth": 0.8,
                        "orientation": "auto",
                        "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true },
                        "tooltip": { "mode": "multi", "sort": "none" },
                        "xTickLabelRotation": -30,
                        "xTickLabelSpacing": 100
                      },
                      "fieldConfig": {
                        "defaults": {
                          "unit": "kg",
                          "decimals": 1,
                          "custom": { "fillOpacity": 80, "lineWidth": 0 }
                        },
                        "overrides": [
                          { "matcher": { "id": "byName", "options": "invoice_weight_kg" },
                            "properties": [{ "id": "displayName", "value": "Invoice Weight" }, { "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } }] },
                          { "matcher": { "id": "byName", "options": "measured_weight_kg" },
                            "properties": [{ "id": "displayName", "value": "Measured Weight" }, { "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } }] }
                        ]
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "datarecon-infinity" },
                          "type": "json",
                          "source": "url",
                          "url": "https://1yyjmleyke.execute-api.us-east-1.amazonaws.com/dev/v1/reconcile?year=${year}&month=${month}",
                          "url_options": { "method": "GET" },
                          "root_selector": "line_items",
                          "columns": [
                            { "selector": "vendor_name", "text": "vendor_name", "type": "string" },
                            { "selector": "invoice_weight_kg", "text": "invoice_weight_kg", "type": "number" },
                            { "selector": "measured_weight_kg", "text": "measured_weight_kg", "type": "number" }
                          ],
                          "format": "table"
                        }
                      ],
                      "transformations": [
                        { "id": "organize", "options": { "renameByName": { "vendor_name": "Vendor" } } }
                      ]
                    },
                    {
                      "id": 9,
                      "title": "Status Breakdown",
                      "description": "Proportion of vendors in each reconciliation status",
                      "type": "piechart",
                      "gridPos": { "h": 10, "w": 10, "x": 14, "y": 3 },
                      "options": {
                        "displayLabels": ["percent", "name"],
                        "legend": { "displayMode": "table", "placement": "right", "showLegend": true, "values": ["percent", "value"] },
                        "pieType": "pie",
                        "tooltip": { "mode": "single", "sort": "none" }
                      },
                      "fieldConfig": {
                        "defaults": {},
                        "overrides": [
                          { "matcher": { "id": "byName", "options": "within_tolerance" },
                            "properties": [{ "id": "displayName", "value": "Within Tolerance" }, { "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } }] },
                          { "matcher": { "id": "byName", "options": "over_tolerance" },
                            "properties": [{ "id": "displayName", "value": "Over Tolerance" }, { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }] },
                          { "matcher": { "id": "byName", "options": "invoice_only" },
                            "properties": [{ "id": "displayName", "value": "Invoice Only" }, { "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } }] },
                          { "matcher": { "id": "byName", "options": "measurement_only" },
                            "properties": [{ "id": "displayName", "value": "Measurement Only" }, { "id": "color", "value": { "mode": "fixed", "fixedColor": "yellow" } }] }
                        ]
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "datarecon-infinity" },
                          "type": "json",
                          "source": "url",
                          "url": "https://1yyjmleyke.execute-api.us-east-1.amazonaws.com/dev/v1/reconcile?year=${year}&month=${month}",
                          "url_options": { "method": "GET" },
                          "root_selector": "summary",
                          "columns": [
                            { "selector": "within_tolerance", "text": "within_tolerance", "type": "number" },
                            { "selector": "over_tolerance", "text": "over_tolerance", "type": "number" },
                            { "selector": "invoice_only", "text": "invoice_only", "type": "number" },
                            { "selector": "measurement_only", "text": "measurement_only", "type": "number" }
                          ],
