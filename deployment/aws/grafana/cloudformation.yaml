                    {
                      "id": 10,
                      "title": "Discrepancy % by Vendor",
                      "description": "Percentage difference between invoice and measured weight. Red = exceeds tolerance.",
                      "type": "bargauge",
                      "gridPos": { "h": 10, "w": 14, "x": 0, "y": 13 },
                      "options": {
                        "displayMode": "gradient",
                        "orientation": "horizontal",
                        "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": true },
                        "showUnfilled": true,
                        "valueMode": "color",
                        "minVizWidth": 0,
                        "minVizHeight": 16
                      },
                      "fieldConfig": {
                        "defaults": {
                          "unit": "percent",
                          "decimals": 1,
                          "min": 0,
                          "thresholds": {
                            "mode": "absolute",
                            "steps": [
                              { "color": "green", "value": null },
                              { "color": "orange", "value": 3 },
                              { "color": "red", "value": 5 }
                            ]
                          },
                          "color": { "mode": "thresholds" },
                          "mappings": [{ "type": "special", "options": { "match": "null", "result": { "text": "N/A" } } }]
                        },
                        "overrides": []
                      },
                      "targets": [
                        {
                          "refId": "A",
                          "datasource": { "type": "yesoreyeram-infinity-datasource", "uid": "datarecon-infinity" },
                          "type": "json",
                          "source": "url",
                          "url": "https://1yyjmleyke.execute-api.us-east-1.amazonaws.com/dev/v1/reconcile?year=${year}&month=${month}",
                          "url_options": { "method": "GET" },
                          "root_selector": "line_items",
                          "columns": [
                            { "selector": "vendor_name", "text": "vendor_name", "type": "string" },
                            { "selector": "discrepancy_pct", "text": "discrepancy_pct", "type": "number" }
                          ],
                          "format": "table"
                        }
                      ],
                      "transformations": [
                        { "id": "organize", "options": { "renameByName": { "vendor_name": "Vendor", "discrepancy_pct": "Discrepancy %" } } },
                        { "id": "labelsToFields", "options": { "mode": "rows", "keepLabels": [] } }
                      ]
                    },
                    {
                      "id": 11,
                      "title": "Vendor Line Items",
                      "description": "Full reconciliation detail per vendor. Status colour: green=within tolerance, red=over tolerance, orange=invoice only, yellow=measurement only.",
                      "type": "table",
                      "gridPos": { "h": 12, "w": 24, "x": 0, "y": 23 },
                      "options": {
                        "footer": { "show": false },
                        "showHeader": true,
                        "cellHeight": "sm",
                        "sortBy": [{ "displayName": "Discrepancy %", "desc": true }]
                      },
                      "fieldConfig": {
                        "defaults": {
                          "custom": { "align": "auto", "cellOptions": { "type": "auto" }, "filterable": true }
                        },
                        "overrides": [
                          { "matcher": { "id": "byName", "options": "status" },
                            "properties": [
                              { "id": "custom.cellOptions", "value": { "type": "color-background", "mode": "basic" } },
                              { "id": "mappings", "value": [
                                { "type": "value", "options": { "within_tolerance": { "color": "green", "index": 0 } } },
                                { "type": "value", "options": { "over_tolerance": { "color": "red", "index": 1 } } },
                                { "type": "value", "options": { "invoice_only": { "color": "orange", "index": 2 } } },
                                { "type": "value", "options": { "measurement_only": { "color": "yellow", "index": 3 } } }
                              ]}
                            ]
                          },
                          { "matcher": { "id": "byName", "options": "invoice_weight_kg" },
                            "properties": [{ "id": "unit", "value": "kg" }, { "id": "decimals", "value": 1 }, { "id": "displayName", "value": "Invoice Weight (kg)" }] },
                          { "matcher": { "id": "byName", "options": "measured_weight_kg" },
                            "properties": [{ "id": "unit", "value": "kg" }, { "id": "decimals", "value": 1 }, { "id": "displayName", "value": "Measured Weight (kg)" }] },
                          { "matcher": { "id": "byName", "options": "discrepancy_kg" },
                            "properties": [{ "id": "unit", "value": "kg" }, { "id": "decimals", "value": 1 }, { "id": "displayName", "value": "Discrepancy (kg)" }] },
                          { "matcher": { "id": "byName", "options": "discrepancy_pct" },
                            "properties": [{ "id": "unit", "value": "percent" }, { "id": "decimals", "value": 1 }, { "id": "displayName", "value": "Discrepancy %" }] },
                          { "matcher": { "id": "byName", "options": "vendor_name" },
                            "properties": [{ "id": "displayName", "value": "Vendor" }, { "id": "custom.width", "value": 200 }] },
                          { "matcher": { "id": "byName", "options": "invoice_count" },
                            "properties": [{ "id": "displayName", "value": "Invoices" }] },
                          { "matcher": { "id": "byName", "options": "measurement_count" },
                            "properties": [{ "id": "displayName", "value": "Measurements" }] }
                        ]
                      },
                      "targets": [
                        {
