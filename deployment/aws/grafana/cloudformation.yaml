          commands:
            01-daemon-reload:
              command: "systemctl daemon-reload"
            02-enable-grafana:
              command: "systemctl enable grafana-server"
            03-start-grafana:
              command: "systemctl start grafana-server"

    # CloudFormation waits up to 15 min for cfn-signal before marking the update failed
    CreationPolicy:
      ResourceSignal:
        Timeout: PT15M

    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref GrafanaInstanceProfile
      ImageId: "{{resolve:ssm:/aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id}}"
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref GrafanaSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: grafana-datarecon
        - Key: Project
          Value: crud-pdf
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > /var/log/userdata.log 2>&1

          apt-get update -y
          apt-get upgrade -y
          apt-get install -y apt-transport-https wget gnupg curl python3-pip

          # ── Grafana APT repo ──
          mkdir -p /etc/apt/keyrings
          wget -q -O /etc/apt/keyrings/grafana.asc https://apt.grafana.com/gpg-full.key
          chmod 644 /etc/apt/keyrings/grafana.asc
          echo "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main" \
            | tee /etc/apt/sources.list.d/grafana.list
          apt-get update -y
          apt-get install -y grafana

          # ── Infinity plugin ──
          grafana-cli plugins install yesoreyeram-infinity-datasource

          # ── Allow unsigned plugin ──
          sed -i \
            's/;allow_loading_unsigned_plugins =/allow_loading_unsigned_plugins = yesoreyeram-infinity-datasource/' \
            /etc/grafana/grafana.ini

          # ── cfn-init: places provisioning files then starts Grafana ──
          pip3 install https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-py3-latest.tar.gz

          /usr/local/bin/cfn-init -v \
            --stack ${AWS::StackName} \
            --resource GrafanaEC2Instance \
            --region ${AWS::Region} \
            || { echo "cfn-init failed"; /usr/local/bin/cfn-signal -e 1 --stack ${AWS::StackName} --resource GrafanaEC2Instance --region ${AWS::Region}; exit 1; }

          /usr/local/bin/cfn-signal -e 0 \
            --stack ${AWS::StackName} \
            --resource GrafanaEC2Instance \
            --region ${AWS::Region}

          echo "Bootstrap complete — Grafana provisioned and running on :3000"

Outputs:
  PublicIP:
    Description: "EC2 public IP address"
    Value: !GetAtt GrafanaEC2Instance.PublicIp
  PublicDNS:
    Description: "EC2 public DNS hostname"
    Value: !GetAtt GrafanaEC2Instance.PublicDnsName
  GrafanaURL:
    Description: "Grafana UI"
    Value: !Sub "http://${GrafanaEC2Instance.PublicDnsName}:3000"
  SSHCommand:
    Description: "SSH command (replace <key.pem>)"
    Value: !Sub "ssh -i <key.pem> ubuntu@${GrafanaEC2Instance.PublicIp}"
  UserDataLog:
    Description: "Bootstrap log path on instance"
    Value: "/var/log/userdata.log"
